name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq empty
      - name: ShellCheck
        run: shellcheck -S error git-guard/hooks/*.sh git-guard/tests/*.sh
      - name: Hook tests
        run: bash git-guard/tests/run.sh
